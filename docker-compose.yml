services:
  powertrader:
    image: swedishhh/powertrader:latest
    ports:
      - "8080:8080"
    volumes:
      # All persistent data lives under POWERTRADER_ROOT on the host.
      # Set POWERTRADER_ROOT in a .env file next to this docker-compose.yml.
      # The directory must exist before first run (see DOCKER.md).
      - ${POWERTRADER_ROOT}/state:/app/state
      - ${POWERTRADER_ROOT}/pt_config.json:/app/pt_config.json
      - ${POWERTRADER_ROOT}/exchange_api_keys.json:/app/exchange_api_keys.json
    restart: unless-stopped
