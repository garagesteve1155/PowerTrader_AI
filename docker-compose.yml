services:
  powertrader:
    # Use 'latest' for the most recent release, or pin to a specific version e.g. swedishhh/powertrader:1.0.0
    image: swedishhh/powertrader:latest
    platform: linux/amd64
    ports:
      # Left side = port on YOUR machine. Change this if 8080 is already in use.
      # Right side = port inside the container. Do not change this.
      - "8080:8080"
    volumes:
      # Replace /Users/yourname/powertrader with the full path to your data folder.
      # Mac:     /Users/yourname/powertrader
      # Linux:   /home/yourname/powertrader
      # Windows: C:/Users/yourname/powertrader
      - /Users/yourname/powertrader/state:/app/state
      - /Users/yourname/powertrader/pt_config.json:/app/pt_config.json
      - /Users/yourname/powertrader/exchange_api_keys.json:/app/exchange_api_keys.json
    restart: unless-stopped
