services:
  powertrader:
    image: powertrader:latest
    ports:
      - "8080:8080"
    environment:
      # Fill in your exchange API keys here.
      # Only set the exchanges you use — others can be left blank.
      KRAKEN_API_KEY: ""
      KRAKEN_API_SECRET: ""
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      KUCOIN_API_KEY: ""
      KUCOIN_API_SECRET: ""
    volumes:
      - ./state:/app/state
      - ./pt_config.json:/app/pt_config.json
    restart: unless-stopped
